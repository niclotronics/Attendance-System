<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>{{ system }} | {{ college }}</title>
<link rel="stylesheet" href="{{ url_for('static', filename='style.css') }}">
<link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.css">
<script src="https://cdnjs.cloudflare.com/ajax/libs/qrcodejs/1.0.0/qrcode.min.js"></script>
</head>
<body>
<div class="page-wrap">

  <header class="app-header">
    <h1>{{ college }}</h1>
    <h2>{{ department }}</h2>
    <h3>{{ system }}</h3>
  </header>

  <main class="main-content">
    <div class="center-wrap">
      <div class="glass-card login-card">
        
        <!-- Navigation Tabs -->
        <div class="nav-tabs">
          <button class="nav-tab active" id="tabMarkBtn" onclick="switchStudentTab('mark')">
            <i class="bi bi-fingerprint"></i> Mark Attendance
          </button>
          <button class="nav-tab" id="tabCheckBtn" onclick="switchStudentTab('check')">
            <i class="bi bi-person-chart"></i> Check Analytics
          </button>
        </div>

        <!-- ============ TAB 1: MARK ATTENDANCE ============ -->
        <div id="tabMarkView">
          <div class="icon-circle"><i class="bi bi-qr-code-scan"></i></div>
          <h3 style="text-align:center;margin-top:0;margin-bottom:18px;">Student Attendance Portal</h3>

          <div id="alertBox"></div>

          <form id="attendanceForm" autocomplete="off">
            <div class="form-group">
              <label for="student_id"><i class="bi bi-person-badge"></i> Student ID / Roll Number</label>
              <input type="text" id="student_id" name="student_id" class="form-control" placeholder="e.g. 2503068" required autofocus>
            </div>
            <div class="form-group">
              <label for="password"><i class="bi bi-key-fill"></i> Attendance Password (6 Chars)</label>
              <input type="text" id="password" name="password" maxlength="6" class="form-control" placeholder="Enter 6-digit code" required style="text-transform:uppercase;letter-spacing:4px;font-weight:700;font-family:monospace;text-align:center;font-size:1.1rem;">
            </div>
            <button type="submit" class="btn btn-primary btn-block" id="submitBtn">
              <i class="bi bi-check2-circle"></i> Mark My Attendance
            </button>
          </form>

          <div style="text-align:center;margin-top:20px;">
            <a href="{{ url_for('generate_login') }}" style="color:var(--text-muted);font-size:0.82rem;text-decoration:none;" class="btn-outline btn btn-sm">
              <i class="bi bi-shield-lock"></i> Teacher / Admin Access
            </a>
          </div>
        </div>

        <!-- ============ TAB 2: CHECK MY ANALYTICS ============ -->
        <div id="tabCheckView" style="display:none;">
          <div class="icon-circle" style="background:linear-gradient(135deg, #3b82f6, #00adb5);"><i class="bi bi-graph-up-arrow"></i></div>
          <h3 style="text-align:center;margin-top:0;margin-bottom:18px;">Check Attendance Status</h3>

          <div class="form-group">
            <label for="lookup_sid"><i class="bi bi-search"></i> Enter Your Student ID</label>
            <div style="display:flex;gap:8px;">
              <input type="text" id="lookup_sid" class="form-control" placeholder="e.g. 2503068">
              <button class="btn btn-primary btn-sm" id="btnLookup" onclick="fetchStudentAnalyticsSelf()"><i class="bi bi-search"></i> View</button>
            </div>
          </div>

          <div id="lookupAlert"></div>
          <div id="lookupResult" style="display:none;margin-top:16px;"></div>
        </div>

      </div>
    </div>
  </main>

  <footer class="app-footer">{{ footer }}</footer>
</div>

<script src="{{ url_for('static', filename='script.js') }}"></script>
<script>
const form = document.getElementById("attendanceForm");
const alertBox = document.getElementById("alertBox");
const submitBtn = document.getElementById("submitBtn");

// Auto-fill from URL query parameters (e.g. scanned via QR Code)
window.addEventListener("DOMContentLoaded", () => {
  const urlParams = new URLSearchParams(window.location.search);
  const pwd = urlParams.get("password");
  if (pwd) {
    document.getElementById("password").value = pwd.toUpperCase();
    showToast("Session Password auto-filled from QR code!", "success");
  }
});

function switchStudentTab(tab) {
  const markBtn = document.getElementById("tabMarkBtn");
  const checkBtn = document.getElementById("tabCheckBtn");
  const markView = document.getElementById("tabMarkView");
  const checkView = document.getElementById("tabCheckView");

  if (tab === 'mark') {
    markBtn.classList.add("active");
    checkBtn.classList.remove("active");
    markView.style.display = "block";
    checkView.style.display = "none";
  } else {
    checkBtn.classList.add("active");
    markBtn.classList.remove("active");
    checkView.style.display = "block";
    markView.style.display = "none";
  }
}

form.addEventListener("submit", async (e) => {
  e.preventDefault();
  clearAlert(alertBox);
  submitBtn.disabled = true;
  submitBtn.innerHTML = '<i class="bi bi-geo-alt"></i> Verifying Location...';

  const student_id = document.getElementById("student_id").value.trim();
  const password = document.getElementById("password").value.trim().toUpperCase();

  let student_lat = null, student_lng = null;

  if ("geolocation" in navigator) {
    try {
      const pos = await new Promise((resolve, reject) => {
        navigator.geolocation.getCurrentPosition(resolve, reject, {
          enableHighAccuracy: true,
          timeout: 8000,
          maximumAge: 0
        });
      });
      student_lat = pos.coords.latitude;
      student_lng = pos.coords.longitude;
    } catch (gErr) {
      console.warn("Student Geolocation unavailable or permission denied:", gErr);
    }
  }

  try {
    const data = await postJSON("/mark_attendance", {
      student_id,
      password,
      student_lat,
      student_lng
    });

    if (data.status === "success") {
      showAlert(alertBox, data.message, "success");
      showToast(data.message, "success");
      form.reset();
    } else {
      showAlert(alertBox, data.message, "error");
    }
  } catch (err) {
    console.error("Submission Error:", err);
    showAlert(alertBox, "Connection issue. Unable to reach attendance server. If scanning from a mobile phone, please ensure your phone is connected to the same Wi-Fi and accessing via the server IP URL (e.g. http://192.168.x.x:5050).", "error");
  } finally {
    submitBtn.disabled = false;
    submitBtn.innerHTML = '<i class="bi bi-check2-circle"></i> Mark My Attendance';
  }
});

async function fetchStudentAnalyticsSelf() {
  const sid = document.getElementById("lookup_sid").value.trim();
  const lookupAlert = document.getElementById("lookupAlert");
  const lookupResult = document.getElementById("lookupResult");
  clearAlert(lookupAlert);

  if (!sid) {
    showAlert(lookupAlert, "Please enter your Student ID.", "error");
    return;
  }

  try {
    const res = await getJSON(`/api/student_lookup/${sid}`);
    if (res.status === "success") {
      const data = res.data;
      const statusBadge = data.status === "Safe" ? "badge-safe" : data.status === "Warning" ? "badge-warning" : "badge-danger";
      
      let breakdownRows = data.breakdown.map(b => `
        <tr>
          <td><strong>${b.subject}</strong></td>
          <td>${b.sessions_attended} / ${b.sessions_conducted}</td>
          <td><span class="badge ${progressColorClass(b.percentage)}">${b.percentage}%</span></td>
        </tr>
      `).join("");

      lookupResult.innerHTML = `
        <div style="background:rgba(15,23,42,0.8);padding:16px;border-radius:12px;border:1px solid var(--glass-border);">
          <div style="display:flex;justify-content:space-between;align-items:center;margin-bottom:10px;">
            <h4 style="margin:0;font-size:1.05rem;">${data.name}</h4>
            <span class="badge ${statusBadge}">${data.status} Zone</span>
          </div>
          <div style="font-size:1.5rem;font-weight:700;color:var(--accent);margin-bottom:12px;">
            Overall: ${data.overall_percentage}%
          </div>
          <div class="table-wrap">
            <table class="data-table" style="font-size:0.82rem;">
              <thead><tr><th>Subject</th><th>Attended</th><th>%</th></tr></thead>
              <tbody>${breakdownRows}</tbody>
            </table>
          </div>
        </div>
      `;
      lookupResult.style.display = "block";
    } else {
      lookupResult.style.display = "none";
      showAlert(lookupAlert, res.message || "Student not found.", "error");
    }
  } catch (err) {
    showAlert(lookupAlert, "Failed to load student attendance data.", "error");
  }
}
</script>
</body>
</html>
