<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>{{ system }} | {{ college }}</title>
<link rel="stylesheet" href="{{ url_for('static', filename='style.css') }}">
<link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.css">
</head>
<body>
<div class="page-wrap">

  <header class="app-header">
    <h1>{{ college }}</h1>
    <h2>{{ department }}</h2>
    <h3>{{ system }}</h3>
  </header>

  <main class="main-content">
    <div class="center-wrap">
      <div class="glass-card login-card">
        <div class="icon-circle"><i class="bi bi-fingerprint"></i></div>
        <h3>Student Attendance</h3>

        <div id="alertBox"></div>

        <form id="attendanceForm" autocomplete="off">
          <div class="form-group">
            <label for="student_id">Student ID</label>
            <input type="text" id="student_id" name="student_id" class="form-control" placeholder="e.g. L2001" required>
          </div>
          <div class="form-group">
            <label for="password">Attendance Password</label>
            <input type="text" id="password" name="password" maxlength="6" class="form-control" placeholder="6 character code" required style="text-transform:uppercase;letter-spacing:3px;">
          </div>
          <button type="submit" class="btn btn-primary btn-block" id="submitBtn">
            <i class="bi bi-check2-circle"></i> Mark Attendance
          </button>
        </form>
      </div>
    </div>
  </main>

  <footer class="app-footer">{{ footer }}</footer>
</div>

<script src="{{ url_for('static', filename='script.js') }}"></script>
<script>
const form = document.getElementById("attendanceForm");
const alertBox = document.getElementById("alertBox");
const submitBtn = document.getElementById("submitBtn");

form.addEventListener("submit", async (e) => {
  e.preventDefault();
  clearAlert(alertBox);
  submitBtn.disabled = true;
  submitBtn.innerHTML = '<i class="bi bi-hourglass-split"></i> Checking...';

  const student_id = document.getElementById("student_id").value.trim();
  const password = document.getElementById("password").value.trim().toUpperCase();

  try {
    const data = await postJSON("/mark_attendance", { student_id, password });
    if (data.status === "success") {
      showAlert(alertBox, data.message, "success");
      form.reset();
    } else {
      showAlert(alertBox, data.message, "error");
    }
  } catch (err) {
    showAlert(alertBox, "Something went wrong. Please try again.", "error");
  } finally {
    submitBtn.disabled = false;
    submitBtn.innerHTML = '<i class="bi bi-check2-circle"></i> Mark Attendance';
  }
});
</script>
</body>
</html>
