<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Teacher Authentication | {{ college }}</title>
<link rel="stylesheet" href="{{ url_for('static', filename='style.css') }}">
<link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.css">
</head>
<body>
<div class="page-wrap">

  <header class="app-header">
    <h1>{{ college }}</h1>
    <h2>{{ department }}</h2>
    <h3>{{ system }}</h3>
  </header>

  <main class="main-content">
    <div class="center-wrap">
      <div class="glass-card login-card">
        <div class="icon-circle"><i class="bi bi-shield-lock"></i></div>
        <h3>🔐 Teacher Authentication</h3>

        {% if error %}
        <div class="alert alert-error">{{ error }}</div>
        {% endif %}

        <form method="POST" autocomplete="off">
          <input type="hidden" name="next" value="{{ next_url }}">
          <div class="form-group">
            <label for="security_key">Enter Teacher Security Key</label>
            <input type="password" id="security_key" name="security_key" class="form-control" placeholder="Security Key" required autofocus>
          </div>
          <button type="submit" class="btn btn-primary btn-block">
            <i class="bi bi-unlock"></i> Authenticate
          </button>
        </form>

        <div style="text-align:center;margin-top:16px;">
          <a href="{{ url_for('student_login') }}" class="btn btn-outline btn-sm">
            <i class="bi bi-arrow-left"></i> Back to Student Login
          </a>
        </div>
      </div>
    </div>
  </main>

  <footer class="app-footer">{{ footer }}</footer>
</div>
</body>
</html>
